name: Frontend quality gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, lint, unit, build and Chromium E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATA_SOURCE: fixture
    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1 (Node 24)
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Install Chromium headless shell and OS dependencies
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Browser regression and visual evidence
        run: pnpm test:e2e
      - name: Retain review evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: frontend-review-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  catalog-database:
    name: PostgreSQL migrations, seed and read parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      DATA_SOURCE: fixture
      # Ephemeral CI-only credentials; never production secrets or shared data.
      TEST_DATABASE_URL: postgresql://bookstore_catalog:bookstore-ci-only@127.0.0.1:55433/bookstore_catalog_ci
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: bookstore_catalog
          POSTGRES_PASSWORD: bookstore-ci-only
          POSTGRES_DB: bookstore_catalog_ci
        ports:
          - "127.0.0.1:55433:5432"
        options: >-
          --health-cmd "pg_isready -U bookstore_catalog -d bookstore_catalog_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client without database access
        run: pnpm db:generate
      - name: Test isolated migrations, constraints, seed and adapters
        run: pnpm test:db --reporter=default --reporter=junit --outputFile=database-test-results/catalog-database.xml
      - name: Build the default fixture-mode storefront
        run: pnpm build
      - name: Prepare only the ephemeral CI catalog for browser reads
        env:
          DATABASE_URL: postgresql://bookstore_catalog:bookstore-ci-only@127.0.0.1:55433/bookstore_catalog_ci
        run: pnpm db:migrate && pnpm db:seed
      - name: Install Chromium headless shell and OS dependencies
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Regress storefront with explicit local database reads
        env:
          DATA_SOURCE: database
          DATABASE_URL: postgresql://bookstore_catalog:bookstore-ci-only@127.0.0.1:55433/bookstore_catalog_ci
          BOOKSTORE_LOCAL_DB_READS: "1"
        run: pnpm test:e2e
      - name: Verify HTTP source failures never serve fixture fallback
        run: pnpm test:source-failure
      - name: Retain database test evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-database-evidence
          path: |
            database-test-results/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  auth-security-spike:
    name: Isolated Better Auth compatibility and security spike
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      # This service/database is disposable and unrelated to either catalog job.
      SPIKE_TEST_DATABASE_URL: postgresql://bookstore_spike_bootstrap:bookstore-spike-ci-only@127.0.0.1:55435/bookstore_auth_spike_ci
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: bookstore_spike_bootstrap
          POSTGRES_PASSWORD: bookstore-spike-ci-only
          POSTGRES_DB: bookstore_auth_spike_ci
        ports:
          - "127.0.0.1:55435:5432"
        options: >-
          --health-cmd "pg_isready -U bookstore_spike_bootstrap -d bookstore_auth_spike_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out spike
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck the isolated experiment independently
        run: pnpm auth:spike:typecheck
      - name: Test real SDK, MFA admission, failure behavior and SQL privileges
        run: pnpm auth:spike:test --reporter=default --reporter=junit --outputFile=auth-spike-test-results/security.xml
      - name: Retain bounded spike evidence (never secrets/database files)
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-security-spike-evidence
          path: auth-spike-test-results/security.xml
          if-no-files-found: warn
          retention-days: 7

  auth-spike-full-audit:
    name: Full dependency audit including spike dev dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out spike
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit the entire graph without suppressing known findings
        run: |
          mkdir -p auth-spike-test-results
          pnpm audit --json > auth-spike-test-results/dependency-audit.json
      - name: Retain actual audit result even when it fails
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-spike-full-audit-evidence
          path: auth-spike-test-results/dependency-audit.json
          if-no-files-found: warn
          retention-days: 7

  security-foundation:
    name: Security foundation migrations privileges governance and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      SECURITY_TEST_DATABASE_URL: postgresql://bookstore_security_bootstrap:bookstore-security-ci-only@127.0.0.1:55437/bookstore_security_ci
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: bookstore_security_bootstrap
          POSTGRES_PASSWORD: bookstore-security-ci-only
          POSTGRES_DB: bookstore_security_ci
        ports:
          - "127.0.0.1:55437:5432"
        options: >-
          --health-cmd "pg_isready -U bookstore_security_bootstrap -d bookstore_security_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out authorized foundation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify isolated canonical migrations and restricted security foundation
        run: pnpm security:test --reporter=default --reporter=junit --outputFile=security-test-results/foundation.xml
      - name: Retain only redacted foundation test evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-foundation-evidence
          path: security-test-results/foundation.xml
          if-no-files-found: warn
          retention-days: 7

  provider-proof:
    name: Unmounted canonical provider session and MFA proof contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      # Ephemeral, loopback-only CI bootstrap value, never a real operational key.
      SECURITY_TEST_DATABASE_URL: postgresql://bookstore_security_bootstrap:${{ github.run_id }}-${{ github.run_attempt }}-disposable@127.0.0.1:55437/bookstore_security_ci
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: bookstore_security_bootstrap
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-disposable
          POSTGRES_DB: bookstore_security_ci
        ports:
          - "127.0.0.1:55437:5432"
        options: >-
          --health-cmd "pg_isready -U bookstore_security_bootstrap -d bookstore_security_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out authorized unmounted integration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify canonical SDK sessions TOTP cookies commit faults and closed admission
        run: pnpm provider:proof:test --reporter=default --reporter=junit --outputFile=provider-proof-test-results/proof.xml
      - name: Retain only sanitized unmounted investigation evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-proof-evidence
          path: provider-proof-test-results/proof.xml
          if-no-files-found: warn
          retention-days: 7

  admission-controls:
    name: Dormant durable MFA admission replay and abuse controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      # Ephemeral loopback-only CI bootstrap; never an operational credential.
      SECURITY_TEST_DATABASE_URL: postgresql://bookstore_security_bootstrap:${{ github.run_id }}-${{ github.run_attempt }}-disposable@127.0.0.1:55437/bookstore_security_ci
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: bookstore_security_bootstrap
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-disposable
          POSTGRES_DB: bookstore_security_ci
        ports:
          - "127.0.0.1:55437:5432"
        options: >-
          --health-cmd "pg_isready -U bookstore_security_bootstrap -d bookstore_security_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out gated dormant controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify real SDK durable evidence replay restart races and privileges
        run: pnpm admission:controls:test --reporter=default --reporter=junit --outputFile=provider-proof-test-results/admission.xml
      - name: Retain only sanitized dormant controls evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admission-controls-evidence
          path: provider-proof-test-results/admission.xml
          if-no-files-found: warn
          retention-days: 7

  restricted-https-transport:
    name: Restricted loopback HTTPS authentication transport and browser cookies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      BOOKSTORE_RESTRICTED_HTTPS_TEST: "1"
      # This bootstrap belongs only to this ephemeral test service, never runtime.
      SECURITY_TEST_DATABASE_URL: postgresql://bookstore_security_bootstrap:${{ github.run_id }}-${{ github.run_attempt }}-disposable@127.0.0.1:55437/bookstore_security_ci
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: bookstore_security_bootstrap
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-disposable
          POSTGRES_DB: bookstore_security_ci
        ports:
          - "127.0.0.1:55437:5432"
        options: >-
          --health-cmd "pg_isready -U bookstore_security_bootstrap -d bookstore_security_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out restricted test-only transport
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install maintained isolated certificate and NSS test tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y openssl libnss3-tools
      - name: Install the pinned full Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify real CA-validated wire controls cancellation replay and privileges
        run: pnpm transport:https:test --reporter=default --reporter=junit --outputFile=provider-proof-test-results/https.xml
      - name: Require actual isolated-NSS Chromium TLS and cookie acceptance
        # Independently collect browser trust evidence even if wire tests fail;
        # any failing step still fails this job. Never skip/replace either gate.
        if: ${{ !cancelled() }}
        run: pnpm transport:browser:test --reporter=default --reporter=junit --outputFile=provider-proof-test-results/https-browser.xml
      - name: Build an ordinary production fixture storefront
        run: pnpm build
      - name: Verify production storefront cannot activate authentication
        run: pnpm transport:default-off:test
      - name: Retain only sanitized HTTPS acceptance results
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restricted-https-transport-evidence
          path: |
            provider-proof-test-results/https.xml
            provider-proof-test-results/https-browser.xml
          if-no-files-found: warn
          retention-days: 7
